name: Finite scientific checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Initialize raw-output destination
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/p076-scientific"
          mkdir -p "$output"
          echo "P076_OUTPUT=$output" >> "$GITHUB_ENV"
      - name: Reproduce retained finite study with fail gates
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 2621440
          ulimit -t 300
          timeout --signal=TERM --kill-after=10s 300s \
            python -B reproduce.py --out "$P076_OUTPUT/reproduction" \
            > "$P076_OUTPUT/reproduction.log" 2>&1
      - name: Check supplementary exact arithmetic and refinement
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 2621440
          ulimit -t 60
          cd reviewer_hardening
          export PYTHONPATH="$PWD"
          timeout --signal=TERM --kill-after=5s 60s \
            python -B -m unittest discover -s tests -v \
            > "$P076_OUTPUT/supplement-tests.log" 2>&1
          timeout --signal=TERM --kill-after=5s 30s \
            python -B scripts/run_refinement_audit.py --out "$P076_OUTPUT/refinement" \
            > "$P076_OUTPUT/refinement.log" 2>&1
      - name: Retain raw outputs even when a gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p076-scientific-raw
          path: ${{ runner.temp }}/p076-scientific
          if-no-files-found: warn
          retention-days: 14
